name: publish SDK to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in pyproject.toml to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          requested = os.environ['RELEASE_VERSION']
          if declared != requested:
              raise SystemExit(f'Expected pyproject.toml version {requested}, found {declared}')
          print(f'Building Agent Supra {declared}')
          PY
      - name: Test and build
        run: |
          python -m pip install -e '.[dev]' build twine
          python -m pytest -q
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
