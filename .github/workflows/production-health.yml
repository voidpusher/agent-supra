name: production health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check public health endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = "https://agentsupra.in/healthz"
          for attempt in range(1, 4):
              try:
                  with urlopen(url, timeout=10) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise RuntimeError("Unexpected health response or redirect")
                      payload = json.load(response)
                  if payload.get("ok") is not True:
                      raise RuntimeError("Health payload did not report ok=true")
                  print("Production health check passed")
                  break
              except (OSError, ValueError, RuntimeError) as exc:
                  print(f"Attempt {attempt}/3 failed: {exc}")
                  if attempt == 3:
                      raise SystemExit(1)
                  time.sleep(10)
          PY
