name: production database backup

on:
  schedule:
    # Daily at 02:17 UTC (07:47 IST); avoid the top-of-hour Actions queue.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      restore_check:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: restore-check
          POSTGRES_DB: restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python -m pip install 'cryptography==50.0.2'
      - name: Export and encrypt production database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          umask 077
          pg_dump --dbname="$BACKUP_DATABASE_URL" --format=custom \
            --no-owner --no-privileges --file=backup.dump
          python scripts/backup_archive.py encrypt backup.dump backup.dump.enc
          rm backup.dump
          python scripts/backup_archive.py decrypt backup.dump.enc restore-check.dump
      - name: Restore and check the encrypted export
        env:
          PGPASSWORD: restore-check
        run: |
          set -euo pipefail
          pg_restore --exit-on-error --no-owner --no-privileges \
            --host=localhost --username=postgres --dbname=restore_check \
            restore-check.dump
          test "$(psql --host=localhost --username=postgres --dbname=restore_check \
            --tuples-only --no-align --command="SELECT to_regclass('public.users') IS NOT NULL AND to_regclass('public.runs') IS NOT NULL AND to_regclass('public.schema_info') IS NOT NULL")" = t
          rm restore-check.dump
      - name: Retain encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: agent-supra-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup.dump.enc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
