# One-click deploy on Render: New > Blueprint > pick this repo.
# Creates a Postgres database and the web service. After the first deploy,
# set BASE_URL to the service's URL (or your custom domain) and redeploy.
databases:
  - name: supervisor-db
    plan: 0.1c-256mb
    databaseName: supervisor
    user: supervisor

services:
  - type: web
    name: agent-supra
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supervisor-db
          property: connectionString
      - key: BASE_URL
        value: https://agent-supra.onrender.com
      - key: APP_NAME
        value: Agent Supra
      - key: CONTACT_EMAIL
        value: sanchitp498@gmail.com
      - key: ALLOW_SIGNUP
        value: "true"
      - key: RETENTION_DAYS
        value: "30"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
