<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='none' stroke='%2318222e' stroke-width='2'/%3E%3Crect x='5' y='4.5' width='2' height='7' fill='%23b45309'/%3E%3Crect x='9' y='4.5' width='2' height='7' fill='%23b45309'/%3E%3C/svg%3E">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/app"><span class="brand-mark" aria-hidden="true"></span>{{ app_name }}</a>
    <nav class="nav" aria-label="Main">
      <a href="/app" {% if nav == "runs" %}aria-current="page"{% endif %}>Runs</a>
      <a href="/app/keys" {% if nav == "keys" %}aria-current="page"{% endif %}>API keys</a>
      <a href="/app/settings" {% if nav == "settings" %}aria-current="page"{% endif %}>Settings</a>
      <a href="/docs/quickstart" {% if nav == "docs" %}aria-current="page"{% endif %}>Quickstart</a>
    </nav>
    <div class="who">
      <span>{{ session.workspace_name }}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ session.csrf }}">
        <button class="btn quiet" type="submit">Log out</button>
      </form>
    </div>
  </div>
</header>
<main class="app">
  <div class="wrap">
    {% if notice %}<div class="notice {{ notice.kind }}" role="status">{{ notice.text }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</main>
{% endblock %}
</body>
</html>
