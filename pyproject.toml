[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-supra"
version = "1.0.0"
description = "Notice when an unattended AI agent is stuck, pause it, and show why."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sanchit" }]
keywords = ["ai agents", "llm", "gemini", "monitoring", "cost control", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
# The SDK itself has no dependencies.
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
dev = [
  "agent-supra[server]",
  "pytest>=8",
  "httpx>=0.27",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.scripts]
agent-supra = "agent_supra.cli:main"

[tool.setuptools.packages.find]
include = ["agent_supra*"]

[tool.setuptools.package-data]
"agent_supra.server" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
